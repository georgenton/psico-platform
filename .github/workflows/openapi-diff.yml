name: openapi-diff

# Bloquea PRs cuando los DTOs del back cambian sin regenerar `@psico/api-client`.
#
# Flujo:
#  1. Boot el back con env stub para emitir `apps/api/openapi.json`.
#  2. Corre el generador en modo --check (no escribe, falla si hay diff).
#
# Si CI falla aquí, el dev hace `pnpm --filter @psico/api-client generate` y
# commitea `packages/api-client/src/generated.ts`. Esa única acción mantiene
# el contrato sincronizado.

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/api-client/**"
      - "packages/types/**"
      - ".github/workflows/openapi-diff.yml"

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Env stubs for the API to boot. Real values come from Railway in prod.
      DATABASE_URL: postgresql://x:x@localhost:5432/x
      JWT_SECRET: ci-secret-must-be-at-least-32-chars!!
      R2_ACCOUNT_ID: x
      R2_ACCESS_KEY_ID: x
      R2_SECRET_ACCESS_KEY: x
      R2_BUCKET_NAME: x
      R2_PUBLIC_URL: https://x.example.com
      ANTHROPIC_API_KEY: x
      VOYAGE_API_KEY: x
      # Required because VOICE_PROVIDER defaults to `whisper`. Its absence is
      # why the API had never actually booted here: env validation rejected it
      # on every run, and the job passed anyway because the committed
      # openapi.json satisfied the check that was supposed to wait for a fresh
      # one. The step below now treats a dead process as the answer.
      OPENAI_API_KEY: x
      STRIPE_SECRET_KEY: x
      STRIPE_WEBHOOK_SECRET: x
      STRIPE_PRO_MONTHLY_PRICE_ID: x
      STRIPE_PRO_YEARLY_PRICE_ID: x
      STRIPE_B2B_PRICE_ID: x
      NODE_ENV: development
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from "packageManager" in root package.json
      # (pnpm@10.33.2). Don't pass `version:` here — it conflicts.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Use turbo so transitive workspace deps (`@psico/types`, `@psico/crypto`)
      # build in topological order — `apps/api` consumes `@psico/crypto` types
      # in `rekey.e2e-spec.ts` (Sprint 3) and won't compile without them.
      # turbo.json declares `build: { dependsOn: ["^build"] }` so this single
      # command builds the whole chain.
      - name: Build @psico/api + transitive workspace deps
        run: pnpm turbo run build --filter=@psico/api

      - name: Boot API briefly to emit a FRESH openapi.json
        working-directory: apps/api
        run: |
          # `apps/api/openapi.json` is COMMITTED, so every checkout already
          # contains one. Waiting for the file to "appear" therefore succeeded
          # on the first iteration, before the API had written anything — and
          # succeeded exactly as well when the API never booted at all. What
          # the job then compared the client against was the file already in
          # the tree, which is the one thing it can never disagree with.
          #
          # It let real drift through: an endpoint added to the API shipped
          # with a stale contract and this gate stayed green.
          #
          # Deleting it touches only this disposable checkout.
          rm -f openapi.json

          LOG="${RUNNER_TEMP:-/tmp}/openapi-boot.log"
          node dist/main > "$LOG" 2>&1 &
          PID=$!
          fresh=""
          for i in $(seq 1 60); do
            # A process that died is the answer, not something to wait out.
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::the API exited before emitting openapi.json"
              cat "$LOG"
              exit 1
            fi
            # Complete, not merely present: a running process is writing this
            # file, so an existence test can catch it half-flushed.
            if [ -s openapi.json ] && node -e '
              const d = JSON.parse(require("fs").readFileSync("openapi.json", "utf8"));
              if (!d.openapi || !d.paths || Object.keys(d.paths).length === 0) process.exit(1);
            ' 2>/dev/null; then
              echo "fresh openapi.json emitted after ${i}s"
              fresh=1
              break
            fi
            sleep 1
          done

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          if [ -z "$fresh" ]; then
            echo "::error::no complete openapi.json was emitted within 60s"
            cat "$LOG"
            exit 1
          fi

      - name: Verify generated client is up to date
        run: pnpm --filter @psico/api-client generate:check
